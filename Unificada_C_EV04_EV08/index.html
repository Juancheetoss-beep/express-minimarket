<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prototipo de inicio de sesión de Express MiniMarket. Maqueta responsive de la Unificada C (EV04 + EV08).">
  <title>Iniciar sesión · Express MiniMarket</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body class="login-page">
  <header class="visually-hidden">
    <p>Express MiniMarket · Inicio de sesión</p>
  </header>

  <main class="login-card">
    <img class="login-card__logo" src="assets/logo.png" alt="Logo de Express MiniMarket">
    <h1 class="login-card__title">Inicie sesión para entrar a su tienda</h1>

    <hr class="rule">

    <form class="login-form" data-login-form action="productos.html" method="get">
      <div class="field">
        <label for="correo">Correo</label>
        <input
          id="correo"
          name="correo"
          type="email"
          autocomplete="email"
          inputmode="email"
          required>
      </div>

      <div class="field">
        <label for="contrasena">Contraseña</label>
        <input
          id="contrasena"
          name="contrasena"
          type="password"
          autocomplete="current-password"
          required>
      </div>

      <label class="checkbox">
        <input type="checkbox" data-toggle-password>
        Mostrar contraseña
      </label>

      <hr class="rule">

      <div class="login-actions">
        <button type="submit" class="btn btn--login">Iniciar sesión</button>
      </div>
    </form>
  </main>

  <footer class="login-footer">
    Express MiniMarket · Prototipo de maquetación · Unificada C (EV04 + EV08)
  </footer>

  <script src="js/forms.js"></script>
</body>
</html>
